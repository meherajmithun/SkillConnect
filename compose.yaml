services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: skillconnect
      POSTGRES_USER: skillconnect
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skillconnect -d skillconnect"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: backend
    ports:
      - "8000:8000"
    environment:
      DEBUG: ${DEBUG:-true}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,10.0.2.2}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080}
      POSTGRES_DB: skillconnect
      POSTGRES_USER: skillconnect
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      DEMO_PAYMENTS: ${DEMO_PAYMENTS:-false}
    volumes:
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
  media_data:
