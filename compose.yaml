services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: skillconnect
      POSTGRES_USER: skillconnect
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skillconnect -d skillconnect"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment: &backend_environment
      NODE_ENV: ${NODE_ENV:-development}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080}
      TRUST_PROXY: ${TRUST_PROXY:-}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
      POSTGRES_DB: skillconnect
      POSTGRES_USER: skillconnect
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      MEDIA_DIR: /app/backend/media
      DEMO_PAYMENTS: ${DEMO_PAYMENTS:-false}
      EMAIL_MODE: ${EMAIL_MODE:-console}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_SECURE: ${EMAIL_SECURE:-false}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-true}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-noreply@skillconnect.local}
      SSLCOMMERZ_STORE_ID: ${SSLCOMMERZ_STORE_ID:-}
      SSLCOMMERZ_STORE_PASSWORD: ${SSLCOMMERZ_STORE_PASSWORD:-}
      SSLCOMMERZ_SANDBOX: ${SSLCOMMERZ_SANDBOX:-true}
      PAYMENT_CALLBACK_BASE_URL: ${PAYMENT_CALLBACK_BASE_URL:-}
      FIREBASE_CREDENTIALS: ${FIREBASE_CREDENTIALS:-}
    volumes:
      - media_data:/app/backend/media
      - ./backend/credentials:/app/credentials:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8000/api/health/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 10s
      start_period: 30s
      retries: 5
    depends_on:
      db:
        condition: service_healthy
  push-worker:
    profiles: [push]
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment: *backend_environment
    command: [node, src/push-worker.js, --watch, --interval, "30"]
    volumes:
      - ./backend/credentials:/app/credentials:ro
    depends_on:
      api:
        condition: service_healthy
volumes:
  postgres_data:
  media_data:
