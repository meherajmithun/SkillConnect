name: Validate SkillConnect
on:
  push:
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: skillconnect
          POSTGRES_USER: skillconnect
          POSTGRES_PASSWORD: ci-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U skillconnect" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://skillconnect:ci-password@localhost:5432/skillconnect
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release --dart-define=ALLOW_HTTP=true --dart-define=API_URL=http://10.0.2.2:8000/api/
      - uses: actions/upload-artifact@v4
        with:
          name: SkillConnect-friends-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
      - run: flutter build apk --release --dart-define=DEMO_MODE=true --dart-define=ALLOW_HTTP=true --dart-define=API_URL=http://10.0.2.2:8000/api/
      - uses: actions/upload-artifact@v4
        with:
          name: SkillConnect-offline-demo-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
