# Free faculty-review deployment. Read docs/RENDER_DEPLOYMENT.md for limits.
services:
  - type: web
    name: skillconnect-api
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health/
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY
        value: "1"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: skillconnect-db
          property: connectionString
      - key: DEMO_PAYMENTS
        value: "false"
databases:
  - name: skillconnect-db
    plan: free
    region: singapore
    databaseName: skillconnect
    user: skillconnect
    postgresMajorVersion: "16"
    ipAllowList: []
